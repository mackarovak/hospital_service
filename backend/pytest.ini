[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests
addopts = -ra --strict-markers
cache_dir = .pytest_cache

markers =
    unit: fast checks without external services
    integration: Django/database/service integration checks
    api: HTTP API checks
    e2e: end-to-end workflow checks
