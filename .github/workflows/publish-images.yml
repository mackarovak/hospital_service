name: Publish Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/publish-images.yml

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ghcr.io/mackarovak/hospital_service-backend
          - name: frontend
            context: ./frontend
            image: ghcr.io/mackarovak/hospital_service-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mackarovak/hospital_service

  deploy:
    name: Restart Kubernetes deployments
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' && secrets.KUBECONFIG_TEAM_1 != '' }}
    steps:
      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBECONFIG_TEAM_1 }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Restart MedCat deployments
        run: |
          kubectl -n team-1-ns rollout restart deployment/medcat-backend
          kubectl -n team-1-ns rollout restart deployment/medcat-frontend

      - name: Wait for rollout
        run: |
          kubectl -n team-1-ns rollout status deployment/medcat-backend --timeout=180s
          kubectl -n team-1-ns rollout status deployment/medcat-frontend --timeout=180s
